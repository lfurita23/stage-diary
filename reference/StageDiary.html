<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Diary - 뮤지컬 관람 기록</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS 클라이언트 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    </style>
</head>
<body id="bodyRoot" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 transition-colors duration-200">
    <div id="app" class="w-full max-w-md bg-slate-900 text-slate-100 border-0 sm:border border-slate-800 rounded-none sm:rounded-3xl min-h-screen sm:min-h-[850px] flex flex-col shadow-2xl relative overflow-hidden transition-colors duration-200">
        <!-- 동적 렌더링 영역 -->
    </div>

    <script>
        // ==========================================
        // 🛠️ Supabase 설정 (연동 완료)
        // ==========================================
        const SUPABASE_URL = 'https://qtrzbmmxjkgdbsxqsywr.supabase.co';
        const SUPABASE_ANON_KEY = '방금 복사하신_Publishable_Key_전체를_여기에_붙여넣으세요';
        
        let supabaseClient = null;
        try {
            if (SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('여기에')) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase 초기화 실패 (로컬 모드로 동작합니다)');
        }

        const theaterStations = {
            "블루스퀘어": "6호선 한강진역 2번 출구",
            "예술의전당": "3호선 남부터미널역 5번 출구",
            "샤롯데씨어터": "2/8호선 잠실역 4번 출구",
            "대학로 아트원시어터": "4호선 혜화역 2번 출구",
            "충무아트센터": "2/6호선 신당역 9번 출구",
            "LG아트센터": "1호선 서울역 12번 출구"
        };

        let state = {
            currentUser: null,  
            authMode: 'login',  
            currentTab: 'home', 
            viewMode: 'main',   
            detailTicket: null, 
            theme: 'dark',      
            themeMenuOpen: false, 
            calendarYear: 2026,
            calendarMonth: 4,
            selectedActorFilter: '',
            snsConnected: { instagram: true, twitter: false },
            tickets: [],
            customKeywords: ['넘버 찢었다', '눈물샘 자극', '앙상블 압도적', '텐션 폭발', '무대 연출 예술', '회전극 필수', '애드리브 폭주', '귀가 호강'],
            actorsList: ['정선아', '박혜나', '이지훈', '조승우', '전동석', '강승호', '임찬민', '옥주현'],
            intermissionModalOpen: false,
            intermissionSelectedPlay: '',
            intermissionCustomPlay: '',
            intermissionMemo: '',
            intermissionCheckedKeywords: []
        };

        function applyThemeStyles() {
            const bodyRoot = document.getElementById('bodyRoot');
            const app = document.getElementById('app');
            let isLight = state.theme === 'light';
            if (state.theme === 'system') {
                isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            }

            if (isLight) {
                bodyRoot.className = "bg-slate-100 text-slate-900 min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 transition-colors duration-200";
                app.className = "w-full max-w-md bg-white text-slate-900 border-0 sm:border border-slate-200 rounded-none sm:rounded-3xl min-h-screen sm:min-h-[850px] flex flex-col shadow-2xl relative overflow-hidden transition-colors duration-200";
            } else {
                bodyRoot.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 transition-colors duration-200";
                app.className = "w-full max-w-md bg-slate-900 text-slate-100 border-0 sm:border border-slate-800 rounded-none sm:rounded-3xl min-h-screen sm:min-h-[850px] flex flex-col shadow-2xl relative overflow-hidden transition-colors duration-200";
            }
        }

        function getThemeIconSvg() {
            let activeMode = state.theme;
            if (activeMode === 'system') {
                activeMode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            if (activeMode === 'light') {
                return `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
            } else {
                return `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
            }
        }

        function render() {
            applyThemeStyles();
            const app = document.getElementById('app');

            if (!state.currentUser) {
                app.innerHTML = renderAuthScreen();
                return;
            }

            if (state.viewMode !== 'main') {
                app.innerHTML = renderFullPageForm(state.viewMode);
                return;
            }

            if (state.detailTicket) {
                app.innerHTML = renderDetailModal(state.detailTicket);
                return;
            }

            const isLight = document.getElementById('bodyRoot').classList.contains('bg-slate-100');

            app.innerHTML = `
                <header class="px-6 py-4 flex items-center justify-between border-b ${isLight ? 'border-slate-200 bg-white/95' : 'border-slate-800 bg-slate-900/90'} backdrop-blur sticky top-0 z-20">
                    <div class="flex items-center space-x-2">
                        <h1 class="text-xl font-bold tracking-tight text-purple-600 dark:text-purple-400">Stage Diary</h1>
                        <span class="text-xs ${isLight ? 'text-slate-500' : 'text-slate-400'} font-medium">스테이지 다이어리</span>
                    </div>
                    <div class="flex items-center space-x-2 relative">
                        <button onclick="openIntermissionModal()" class="${isLight ? 'bg-purple-100 text-purple-700 border-purple-300' : 'bg-rose-500/20 text-rose-300 border-rose-500/30'} border px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1 transition shadow-sm">
                            <span>⚡ 인터미션</span>
                        </button>
                        <div class="relative">
                            <button onclick="toggleThemeMenu()" class="p-2 ${isLight ? 'text-slate-600 hover:bg-slate-100' : 'text-slate-300 hover:bg-slate-800'} transition rounded-full" title="테마 설정">
                                ${getThemeIconSvg()}
                            </button>
                            ${state.themeMenuOpen ? `
                                <div class="absolute right-0 mt-2 w-36 ${isLight ? 'bg-white border-slate-200 shadow-xl text-slate-800' : 'bg-slate-800 border-slate-700 shadow-2xl text-slate-100'} border rounded-2xl py-2 z-50 text-xs">
                                    <button onclick="selectTheme('light')" class="w-full text-left px-4 py-2 hover:bg-purple-500/10 flex items-center justify-between"><span>라이트 모드</span> ${state.theme === 'light' ? '✓' : ''}</button>
                                    <button onclick="selectTheme('dark')" class="w-full text-left px-4 py-2 hover:bg-purple-500/10 flex items-center justify-between"><span>다크 모드</span> ${state.theme === 'dark' ? '✓' : ''}</button>
                                    <button onclick="selectTheme('system')" class="w-full text-left px-4 py-2 hover:bg-purple-500/10 flex items-center justify-between"><span>시스템 설정</span> ${state.theme === 'system' ? '✓' : ''}</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </header>

                <main class="flex-1 overflow-y-auto pb-24 hide-scrollbar" onclick="if(state.themeMenuOpen){state.themeMenuOpen=false;render();}">
                    ${state.currentTab === 'home' ? renderHome() : ''}
                    ${state.currentTab === 'ticketbook' ? renderTicketBookTab() : ''}
                    ${state.currentTab === 'calendar' ? renderCalendarTab() : ''}
                    ${state.currentTab === 'mypage' ? renderMyPage() : ''}
                    ${state.currentTab === 'stats' ? renderStatsPage() : ''}
                    ${state.currentTab === 'sns_settings' ? renderSnsSettingsPage() : ''}
                </main>

                <nav class="absolute bottom-0 left-0 right-0 ${isLight ? 'bg-white/95 border-slate-200' : 'bg-slate-900/95 border-slate-800'} backdrop-blur border-t px-6 py-3 flex justify-around items-center z-20">
                    <button onclick="setTab('home')" class="flex flex-col items-center ${state.currentTab === 'home' ? 'text-purple-600 dark:text-purple-400' : isLight ? 'text-slate-500 hover:text-slate-800' : 'text-slate-400 hover:text-slate-200'}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                        <span class="text-[10px] mt-1 font-medium">홈</span>
                    </button>
                    <button onclick="setTab('ticketbook')" class="flex flex-col items-center ${state.currentTab === 'ticketbook' ? 'text-purple-600 dark:text-purple-400' : isLight ? 'text-slate-500 hover:text-slate-800' : 'text-slate-400 hover:text-slate-200'}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                        <span class="text-[10px] mt-1 font-medium">티켓북</span>
                    </button>
                    <button onclick="openFullPageNew()" class="w-12 h-12 bg-gradient-to-tr from-purple-600 to-rose-500 rounded-full flex items-center justify-center text-white shadow-lg hover:scale-105 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                    <button onclick="setTab('calendar')" class="flex flex-col items-center ${state.currentTab === 'calendar' ? 'text-purple-600 dark:text-purple-400' : isLight ? 'text-slate-500 hover:text-slate-800' : 'text-slate-400 hover:text-slate-200'}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span class="text-[10px] mt-1 font-medium">캘린더</span>
                    </button>
                    <button onclick="setTab('mypage')" class="flex flex-col items-center ${state.currentTab === 'mypage' ? 'text-purple-600 dark:text-purple-400' : isLight ? 'text-slate-500 hover:text-slate-800' : 'text-slate-400 hover:text-slate-200'}">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span class="text-[10px] mt-1 font-medium">마이페이지</span>
                    </button>
                </nav>

                ${state.intermissionModalOpen ? renderIntermissionModal() : ''}
            `;
        }

        function renderAuthScreen() {
            const isLogin = state.authMode === 'login';
            return `
                <div class="flex-1 flex flex-col justify-center items-center p-8 space-y-6">
                    <div class="text-center space-y-2">
                        <h1 class="text-3xl font-extrabold tracking-tight text-purple-500">Stage Diary</h1>
                        <p class="text-xs text-slate-400">클라우드로 동기화되는 나만의 뮤지컬 아카이브</p>
                    </div>

                    <div class="w-full space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">이메일 계정</label>
                            <input type="email" id="authEmail" placeholder="example@email.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">비밀번호</label>
                            <input type="password" id="authPassword" placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100">
                        </div>

                        <button onclick="handleAuthSubmit()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl text-sm shadow-lg transition">
                            ${isLogin ? '로그인' : '회원가입'}
                        </button>

                        <div class="flex justify-between items-center text-xs pt-2">
                            <span class="text-slate-400">${isLogin ? '계정이 없으신가요?' : '이미 계정이 있으신가요?'}</span>
                            <button onclick="toggleAuthMode()" class="text-purple-400 font-semibold hover:underline">
                                ${isLogin ? '회원가입하기' : '로그인하기'}
                            </button>
                        </div>

                        <div class="pt-4 border-t border-slate-800 text-center">
                            <button onclick="bypassAuthForDemo()" class="text-xs text-slate-500 hover:text-slate-300 underline">
                                [개발/체험용] 로그인 없이 바로 시작하기
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleAuthMode() {
            state.authMode = state.authMode === 'login' ? 'signup' : 'login';
            render();
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                alert('이메일과 비밀번호를 모두 입력해주세요.');
                return;
            }

            if (!supabaseClient) {
                alert('Supabase 연동 정보가 설정되지 않았습니다. 체험용 모드로 진입합니다.');
                bypassAuthForDemo();
                return;
            }

            try {
                if (state.authMode === 'login') {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    state.currentUser = data.user;
                    await loadTicketsFromSupabase();
                    alert('로그인 성공!');
                } else {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('회원가입 완료! 이메일 인증 후 로그인해주세요.');
                    state.authMode = 'login';
                }
                render();
            } catch (err) {
                alert('인증 오류: ' + err.message);
            }
        }

        function bypassAuthForDemo() {
            state.currentUser = { email: 'musical_lover@stagediary.app', id: 'demo-user' };
            render();
        }

        async function handleLogout() {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            state.currentUser = null;
            render();
        }

        // ==========================================
        // ☁️ Supabase 데이터 동기화 함수들
        // ==========================================
        async function loadTicketsFromSupabase() {
            if (!supabaseClient || !state.currentUser || state.currentUser.id === 'demo-user') return;
            const { data, error } = await supabaseClient
                .from('tickets')
                .select('*')
                .order('id', { ascending: false });
            if (!error && data) {
                state.tickets = data.map(t => ({
                    id: t.id,
                    title: t.title,
                    theater: t.theater,
                    station: t.station,
                    seat: t.seat,
                    seatRating: t.seat_rating,
                    seatMemo: t.seat_memo,
                    date: t.date,
                    timeHour: t.time_hour,
                    timeMin: t.time_min,
                    poster: t.poster,
                    casting: t.casting || [],
                    price: t.price,
                    discount: t.discount,
                    memo: t.memo,
                    sectionTitle: t.section_title,
                    review: t.review,
                    keywords: t.keywords || []
                }));
            }
        }

        async function saveTicketToSupabase(ticketObj) {
            if (!supabaseClient || !state.currentUser || state.currentUser.id === 'demo-user') return;
            const dbData = {
                id: ticketObj.id,
                user_id: state.currentUser.id,
                title: ticketObj.title,
                theater: ticketObj.theater,
                station: ticketObj.station,
                seat: ticketObj.seat,
                seat_rating: ticketObj.seatRating,
                seat_memo: ticketObj.seatMemo,
                date: ticketObj.date,
                time_hour: ticketObj.timeHour,
                time_min: ticketObj.timeMin,
                poster: ticketObj.poster,
                casting: ticketObj.casting,
                price: ticketObj.price,
                discount: ticketObj.discount,
                memo: ticketObj.memo,
                section_title: ticketObj.sectionTitle,
                review: ticketObj.review,
                keywords: ticketObj.keywords
            };
            await supabaseClient.from('tickets').upsert(dbData);
        }

        async function deleteTicketFromSupabase(id) {
            if (!supabaseClient || !state.currentUser || state.currentUser.id === 'demo-user') return;
            await supabaseClient.from('tickets').delete().eq('id', id);
        }

        // ==========================================
        // 🎫 기능 및 렌더링 로직
        // ==========================================
        function toggleThemeMenu() {
            state.themeMenuOpen = !state.themeMenuOpen;
            render();
        }

        function selectTheme(mode) {
            state.theme = mode;
            state.themeMenuOpen = false;
            render();
        }

        function setTab(tab) {
            state.currentTab = tab;
            state.viewMode = 'main';
            state.detailTicket = null;
            state.themeMenuOpen = false;
            render();
        }

        function formatNumber(numStr) {
            if (!numStr) return '';
            const clean = numStr.toString().replace(/[^0-9]/g, '');
            return clean.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function onPriceInput(input) {
            input.value = formatNumber(input.value);
        }

        function onTheaterInput(val) {
            const stationInput = document.getElementById('fStation');
            if (stationInput) {
                if (theaterStations[val]) {
                    stationInput.value = theaterStations[val];
                } else {
                    stationInput.value = "";
                }
            }
        }

        function openFullPageNew(defaultDate = '') {
            state.detailTicket = null;
            state.viewMode = {
                id: null,
                title: '',
                theater: '',
                station: '',
                seat: '',
                seatRating: '⭐⭐⭐⭐⭐',
                seatMemo: '',
                date: defaultDate || new Date().toISOString().split('T')[0],
                timeHour: '19',
                timeMin: '30',
                poster: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300',
                casting: [],
                price: '',
                discount: '',
                memo: '',
                sectionTitle: '작품 감상평',
                review: '',
                keywords: []
            };
            render();
        }

        function openFullPageEdit(id) {
            state.detailTicket = null;
            const ticket = state.tickets.find(t => t.id === id);
            if (ticket) {
                state.viewMode = JSON.parse(JSON.stringify(ticket));
                render();
            }
        }

        function openDetailModal(id) {
            const ticket = state.tickets.find(t => t.id === id);
            if (ticket) {
                state.detailTicket = ticket;
                render();
            }
        }

        function closeDetailModal() {
            state.detailTicket = null;
            render();
        }

        function closeFullPage() {
            state.viewMode = 'main';
            render();
        }

        async function saveTicketFromForm(id) {
            const title = document.getElementById('fTitle').value;
            const date = document.getElementById('fDate').value;
            const timeHour = document.getElementById('fTimeHour').value;
            const timeMin = document.getElementById('fTimeMin').value;
            const theater = document.getElementById('fTheater').value;
            const station = document.getElementById('fStation').value;
            const seat = document.getElementById('fSeat').value;
            const seatRating = document.getElementById('fSeatRating').value;
            const seatMemo = document.getElementById('fSeatMemo').value;
            const price = document.getElementById('fPrice').value.replace(/,/g, '');
            const discount = document.getElementById('fDiscount').value;
            const memo = document.getElementById('fMemo').value;
            const sectionTitle = document.getElementById('fSectionTitle').value;
            const review = document.getElementById('fReview').value;

            if (!title || !date || !theater) {
                alert('필수 항목(제목, 일자, 공연장)을 입력해주세요.');
                return;
            }

            let targetTicket;
            if (id === null) {
                targetTicket = {
                    id: Date.now(),
                    title, theater, station, seat, seatRating, seatMemo, date, timeHour, timeMin,
                    poster: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300',
                    casting: state.viewMode.casting,
                    price, discount, memo, sectionTitle, review,
                    keywords: ['넘버 찢었다']
                };
                state.tickets.unshift(targetTicket);
            } else {
                const idx = state.tickets.findIndex(t => t.id === id);
                if (idx !== -1) {
                    state.tickets[idx] = {
                        ...state.tickets[idx],
                        title, theater, station, seat, seatRating, seatMemo, date, timeHour, timeMin,
                        casting: state.viewMode.casting,
                        price, discount, memo, sectionTitle, review
                    };
                    targetTicket = state.tickets[idx];
                }
            }

            if (targetTicket) {
                await saveTicketToSupabase(targetTicket);
            }

            state.viewMode = 'main';
            render();
        }

                        <p class="text-[11px] text-purple-600 dark:text-purple-400 font-semibold mb-0.5">${ticket.sectionTitle || '작품 감상평'}</p>
                        <p class="text-xs ${isLight ? 'text-slate-700' : 'text-slate-300'} italic">"${ticket.review}"</p>
                    </div>
                </div>
            `;
        }

        function setActorFilter(actor) {
            state.selectedActorFilter = actor;
            render();
        }

        function changeCalendarMonth(delta) {
            state.calendarMonth += delta;
            if (state.calendarMonth > 12) {
                state.calendarMonth = 1;
                state.calendarYear++;
            } else if (state.calendarMonth < 1) {
                state.calendarMonth = 12;
                state.calendarYear--;
            }
            render();
        }

        function renderCalendarTab() {
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const daysInMonth = new Date(year, month, 0).getDate();
            const daysArray = Array.from({length: daysInMonth}, (_, i) => i + 1);
            const isLight = document.getElementById('bodyRoot').classList.contains('bg-slate-100');

            return `
                <div class="p-6 space-y-6">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2 ${isLight ? 'bg-slate-200/70 border-slate-300 text-slate-800' : 'bg-slate-800/40 border-slate-700/50 text-slate-200'} border rounded-2xl px-4 py-2 shadow-sm">
                            <button onclick="changeCalendarMonth(-1)" class="hover:opacity-70 font-bold text-xs px-1">◀</button>
                            <h2 class="text-sm font-bold tracking-wide">${year}년 ${month}월</h2>
                            <button onclick="changeCalendarMonth(1)" class="hover:opacity-70 font-bold text-xs px-1">▶</button>
                        </div>
                        <button onclick="openFullPageNew()" class="bg-purple-600 text-white text-xs px-3.5 py-2 rounded-xl font-semibold shadow-md">+ 일정 등록</button>
                    </div>

                    <div class="grid grid-cols-7 gap-2 text-center text-xs ${isLight ? 'text-slate-600' : 'text-slate-400'} mb-2 font-medium">
                        <span class="text-rose-500">월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span class="text-blue-500">일</span>
                    </div>

                    <div class="grid grid-cols-7 gap-2">
                        ${daysArray.map(day => {
                            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                            const matchedTickets = state.tickets.filter(t => t.date === dateStr);
                            const hasRecord = matchedTickets.length > 0;
                            return `
                                <div onclick="openFullPageNew('${dateStr}')" class="min-h-[90px] ${isLight ? (hasRecord ? 'bg-purple-100/80 border-purple-400 text-slate-900 shadow-sm' : 'bg-white border-slate-200 hover:border-purple-300 shadow-sm') : (hasRecord ? 'bg-purple-950/40 border-purple-500 text-slate-100' : 'bg-slate-900 border-slate-800 hover:border-purple-500/40')} border rounded-xl p-1.5 flex flex-col justify-between cursor-pointer transition">
                                    <div class="flex justify-between items-center pointer-events-none">
                                        <span class="text-xs font-bold ${hasRecord ? (isLight ? 'text-purple-700 font-extrabold' : 'text-purple-400') : isLight ? 'text-slate-800' : 'text-slate-200'}">${day}</span>
                                    </div>
                                    <div class="flex space-x-1 justify-center mt-1 overflow-x-hidden" onclick="event.stopPropagation()">
                                        ${matchedTickets.map(t => `<img src="${t.poster}" onclick="openDetailModal(${t.id})" class="w-6 h-8 object-cover rounded shadow cursor-pointer hover:scale-105 transition" title="${t.title}">`).join('')}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderMyPage() {
            const isLight = document.getElementById('bodyRoot').classList.contains('bg-slate-100');

            return `
                <div class="p-6 space-y-6">
                    <h2 class="text-lg font-bold">마이페이지 & 설정</h2>

                    <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-5 flex flex-col items-center text-center space-y-2">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-purple-600 to-rose-500 flex items-center justify-center text-white text-2xl font-bold shadow-md">
                            S
                        </div>
                        <div>
                            <h3 class="text-base font-bold">뮤지컬러버 님</h3>
                            <p class="text-xs ${isLight ? 'text-slate-500' : 'text-slate-400'} mt-0.5">${state.currentUser?.email || 'musical_lover@stagediary.app'}</p>
                        </div>
                        <button onclick="handleLogout()" class="mt-2 text-xs text-rose-500 hover:underline">로그아웃</button>
                    </div>

                    <div class="bg-gradient-to-r ${isLight ? 'from-purple-50 to-white border-purple-200' : 'from-purple-900/30 to-slate-900 border-purple-500/30'} border rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-purple-500 transition shadow-sm" onclick="goToStatsPage()">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-600 dark:text-purple-400 font-bold">📊</div>
                            <div>
                                <h3 class="text-sm font-bold">나의 관람 통계 대시보드</h3>
                                <p class="text-xs ${isLight ? 'text-slate-500' : 'text-slate-400'}">총 관람횟수, 최애/차애 배우 및 극장 상세 분석</p>
                            </div>
                        </div>
                        <span class="${isLight ? 'text-slate-400' : 'text-slate-400'}">→</span>
                    </div>

                    <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 space-y-3">
                        <h3 class="text-xs font-bold text-purple-600 dark:text-purple-400 uppercase">⚡ 인터미션 키워드 관리</h3>
                        <div class="max-h-28 overflow-y-auto flex flex-wrap gap-1.5 pr-1 hide-scrollbar">
                            ${state.customKeywords.map((kw, idx) => `
                                <span class="${isLight ? 'bg-slate-100 text-slate-700' : 'bg-slate-800 text-slate-300'} text-xs px-2.5 py-1 rounded-lg flex items-center space-x-1 h-7">
                                    <span>#${kw}</span>
                                    <button onclick="removeKeyword(${idx})" class="text-slate-400 hover:text-rose-500 ml-1">×</button>
                                </span>
                            `).join('')}
                        </div>
                        <div class="flex space-x-2 pt-1 border-t ${isLight ? 'border-slate-100' : 'border-slate-800'}">
                            <input type="text" id="newKeywordBox" placeholder="새 키워드 입력 (예: 애드리브 폭주)" class="flex-1 ${isLight ? 'bg-slate-100 border-slate-300 text-slate-900' : 'bg-slate-800 border-slate-700 text-slate-100'} border rounded-xl px-3 py-2 text-xs">
                            <button onclick="addKeyword()" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-xl text-xs font-semibold">추가</button>
                        </div>
                    </div>

                    <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 space-y-4">
                        <div class="space-y-2">
                            <h3 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">🎨 앱 테마 설정</h3>
                            <div class="grid grid-cols-3 gap-2">
                                <button onclick="setTheme('light')" class="py-2 rounded-xl text-xs border ${state.theme === 'light' ? 'bg-purple-600 text-white border-purple-500' : isLight ? 'bg-slate-100 text-slate-700 border-slate-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">라이트 모드</button>
                                <button onclick="setTheme('dark')" class="py-2 rounded-xl text-xs border ${state.theme === 'dark' ? 'bg-purple-600 text-white border-purple-500' : isLight ? 'bg-slate-100 text-slate-700 border-slate-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">다크 모드</button>
                                <button onclick="setTheme('system')" class="py-2 rounded-xl text-xs border ${state.theme === 'system' ? 'bg-purple-600 text-white border-purple-500' : isLight ? 'bg-slate-100 text-slate-700 border-slate-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">시스템 설정</button>
                            </div>
                        </div>

                        <div onclick="goToSnsSettings()" class="pt-3 border-t ${isLight ? 'border-slate-100' : 'border-slate-800'} flex justify-between items-center text-xs cursor-pointer hover:opacity-80">
                            <span class="${isLight ? 'text-slate-700 font-medium' : 'text-slate-300'}">SNS 연동 관리</span>
                            <div class="flex items-center space-x-1">
                                <span class="text-purple-600 dark:text-purple-400 font-semibold">${state.snsConnected.instagram || state.snsConnected.twitter ? '일부 연결됨' : '연동 해제됨'}</span>
                                <span class="text-slate-400">→</span>
                            </div>
                        </div>

                        <div class="flex justify-between items-center text-xs">
                            <span class="${isLight ? 'text-slate-700 font-medium' : 'text-slate-300'}">버전 정보</span>
                            <span class="${isLight ? 'text-slate-500' : 'text-slate-400'}">Stage Diary v1.3.0</span>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button onclick="confirmResetData()" class="w-full bg-rose-500/10 border border-rose-500/30 text-rose-500 dark:text-rose-400 font-semibold py-3 rounded-xl text-xs hover:bg-rose-500/20 transition">기록 데이터 초기화</button>
                    </div>
                </div>
            `;
        }

        function goToSnsSettings() {
            state.currentTab = 'sns_settings';
            render();
        }

        function renderSnsSettingsPage() {
            const isLight = document.getElementById('bodyRoot').classList.contains('bg-slate-100');

            return `
                <div class="p-6 space-y-6">
                    <div class="flex items-center space-x-3 mb-2">
                        <button onclick="setTab('mypage')" class="text-slate-500 dark:text-slate-400 hover:opacity-80">◀ 마이페이지</button>
                        <h2 class="text-lg font-bold">SNS 연동 관리</h2>
                    </div>

                    <p class="text-xs ${isLight ? 'text-slate-600' : 'text-slate-400'}">소셜 계정을 연동하여 관람 카드를 간편하게 공유하고 백업하세요.</p>

                    <div class="space-y-3">
                        <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-pink-500/20 text-pink-500 flex items-center justify-center font-bold">📸</div>
                                <div>
                                    <h3 class="text-sm font-bold">인스타그램 (Instagram)</h3>
                                    <p class="text-xs ${isLight ? 'text-slate-500' : 'text-slate-400'}">${state.snsConnected.instagram ? '@musical_lover 계정 연동 중' : '연동되지 않음'}</p>
                                </div>
                            </div>
                            <button onclick="toggleSns('instagram')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold border ${state.snsConnected.instagram ? 'bg-rose-500/10 text-rose-500 border-rose-500/30' : 'bg-purple-600 text-white border-purple-500'}">
                                ${state.snsConnected.instagram ? '연동 해제' : '계정 연동'}
                            </button>
                        </div>

                        <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-slate-500/20 text-slate-300 flex items-center justify-center font-bold">𝕏</div>
                                <div>
                                    <h3 class="text-sm font-bold">X (Twitter)</h3>
                                    <p class="text-xs ${isLight ? 'text-slate-500' : 'text-slate-400'}">${state.snsConnected.twitter ? '@stagediary_lover 계정 연동 중' : '연동되지 않음'}</p>
                                </div>
                            </div>
                            <button onclick="toggleSns('twitter')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold border ${state.snsConnected.twitter ? 'bg-rose-500/10 text-rose-500 border-rose-500/30' : 'bg-purple-600 text-white border-purple-500'}">
                                ${state.snsConnected.twitter ? '연동 해제' : '계정 연동'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleSns(platform) {
            state.snsConnected[platform] = !state.snsConnected[platform];
            alert(`${platform === 'instagram' ? '인스타그램' : 'X(트위터)'} 연동 상태가 변경되었습니다.`);
            render();
        }

        function goToStatsPage() {
            state.currentTab = 'stats';
            render();
        }

        function renderStatsPage() {
            const isLight = document.getElementById('bodyRoot').classList.contains('bg-slate-100');

            return `
                <div class="p-6 space-y-6">
                    <div class="flex items-center space-x-3 mb-2">
                        <button onclick="setTab('mypage')" class="text-slate-500 dark:text-slate-400 hover:opacity-80">◀ 마이페이지</button>
                        <h2 class="text-lg font-bold">상세 관람 통계 대시보드</h2>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 text-center">
                            <p class="text-xs text-slate-500 dark:text-slate-400">총 관람 횟수</p>
                            <p class="text-2xl font-bold text-purple-600 dark:text-purple-400 mt-1">${state.tickets.length}회</p>
                        </div>
                        <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 text-center">
                            <p class="text-xs text-slate-500 dark:text-slate-400">최애 배우</p>
                            <p class="text-lg font-bold mt-1">정선아</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 text-center">
                            <p class="text-xs text-slate-500 dark:text-slate-400">남배우 차애</p>
                            <p class="text-base font-bold text-purple-600 dark:text-purple-300 mt-1">강승호</p>
                        </div>
                        <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 text-center">
                            <p class="text-xs text-slate-500 dark:text-slate-400">여배우 차애</p>
                            <p class="text-base font-bold text-purple-600 dark:text-purple-300 mt-1">박혜나</p>
                        </div>
                    </div>

                    <div class="${isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-5 space-y-3">
                        <h3 class="text-sm font-bold text-purple-600 dark:text-purple-400">🏛️ 극장별 관람 분포</h3>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between items-center ${isLight ? 'bg-slate-50' : 'bg-slate-950'} p-2.5 rounded-xl">
                                <span>블루스퀘어 신한카드홀</span>
                                <span class="font-bold text-purple-600 dark:text-purple-300">1회 (50%)</span>
                            </div>
                            <div class="flex justify-between items-center ${isLight ? 'bg-slate-50' : 'bg-slate-950'} p-2.5 rounded-xl">
                                <span>대학로 아트원시어터</span>
                                <span class="font-bold text-purple-600 dark:text-purple-300">1회 (50%)</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function addKeyword() {
            const input = document.getElementById('newKeywordBox');
            if (input && input.value.trim()) {
                state.customKeywords.push(input.value.trim());
                input.value = '';
                render();
            }
        }

        function removeKeyword(idx) {
            state.customKeywords.splice(idx, 1);
            render();
        }

        function setTheme(mode) {
            state.theme = mode;
            render();
        }

        function confirmResetData() {
            if (confirm('정말로 모든 관람 기록 데이터를 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                state.tickets = [];
                alert('모든 데이터가 초기화되었습니다.');
                render();
            }
        }

        function openIntermissionModal() {
            state.intermissionModalOpen = true;
            state.intermissionSelectedPlay = state.tickets.length > 0 ? state.tickets[0].title + ' - ' + state.tickets[0].theater : '';
            state.intermissionCustomPlay = '';
            state.intermissionMemo = '';
            state.intermissionCheckedKeywords = [];
            render();
        }

        function closeIntermissionModal() {
            state.intermissionModalOpen = false;
            render();
        }

        function toggleIntermissionKeyword(kw) {
            if (state.intermissionCheckedKeywords.includes(kw)) {
                state.intermissionCheckedKeywords = state.intermissionCheckedKeywords.filter(k => k !== kw);
            } else {
                state.intermissionCheckedKeywords.push(kw);
            }
            render();
        }

        function saveIntermissionRecord() {
            const playName = state.intermissionSelectedPlay === 'CUSTOM' ? state.intermissionCustomPlay : state.intermissionSelectedPlay;
            alert(`[인터미션 기록 저장 완료]\n공연: ${playName || '지정되지 않음'}\n키워드: #${state.intermissionCheckedKeywords.join(', #')}\n메모: ${document.getElementById('intermissionMemoBox')?.value || ''}`);
            closeIntermissionModal();
        }

        function renderIntermissionModal() {
            const isLight = document.getElementById('bodyRoot').classList.contains('bg-slate-100');
            const showCustomInput = state.intermissionSelectedPlay === 'CUSTOM';

            return `
                <div class="absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="${isLight ? 'bg-white text-slate-900' : 'bg-slate-900 text-slate-100'} border ${isLight ? 'border-slate-200' : 'border-slate-800'} rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold">⚡ 인터미션 빠른 기록</h3>
                            <button onclick="closeIntermissionModal()" class="text-slate-400 hover:opacity-80">✕</button>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400">공연 1막 관람 후 잊기 전에 키워드로 빠르게 감상을 남겨보세요!</p>
                        
                        <div>
                            <label class="block text-xs font-medium mb-1">어떤 공연인가요?</label>
                            <select id="intermissionPlaySelect" onchange="state.intermissionSelectedPlay = this.value; render();" class="w-full ${isLight ? 'bg-slate-100 border-slate-300 text-slate-900' : 'bg-slate-800 border-slate-700 text-slate-100'} border rounded-xl px-3 py-2 text-xs mb-2">
                                <option value="">등록된 공연 선택</option>
                                ${state.tickets.map(t => `<option value="${t.title} - ${t.theater}" ${state.intermissionSelectedPlay === (t.title + ' - ' + t.theater) ? 'selected' : ''}>${t.title} (${t.theater})</option>`).join('')}
                                <option value="CUSTOM" ${state.intermissionSelectedPlay === 'CUSTOM' ? 'selected' : ''}>+ 직접 입력</option>
                            </select>
                            
                            ${showCustomInput ? `
                                <input type="text" id="intermissionCustomPlayBox" oninput="state.intermissionCustomPlay = this.value;" value="${state.intermissionCustomPlay}" placeholder="공연명 직접 입력" class="w-full ${isLight ? 'bg-slate-100 border-slate-300 text-slate-900' : 'bg-slate-800 border-slate-700 text-slate-100'} border rounded-xl px-3 py-2 text-xs animate-fadeIn">
                            ` : ''}
                        </div>

                        <div>
                            <label class="block text-xs font-medium mb-1.5">⚡ 1막 핵심 키워드 선택</label>
                            <div class="grid grid-cols-2 gap-2 max-h-36 overflow-y-auto pr-1">
                                ${state.customKeywords.map(kw => {
                                    const checked = state.intermissionCheckedKeywords.includes(kw);
                                    return `
                                        <div onclick="toggleIntermissionKeyword('${kw}')" class="flex items-center justify-between p-2 rounded-xl border cursor-pointer ${checked ? 'border-purple-500 bg-purple-500/10 text-purple-600 dark:text-purple-300' : isLight ? 'border-slate-200 bg-slate-50 text-slate-700' : 'border-slate-800 bg-slate-800/50 text-slate-300'}">
                                            <span class="text-xs">#${kw}</span>
                                            <span class="text-xs font-bold">${checked ? '✓' : '□'}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium mb-1">한 줄 메모 (선택)</label>
                            <input type="text" id="intermissionMemoBox" placeholder="예: 오페라글라스 필수, 1막 엔딩 소름..." class="w-full ${isLight ? 'bg-slate-100 border-slate-300 text-slate-900' : 'bg-slate-800 border-slate-700 text-slate-100'} border rounded-xl px-3 py-2.5 text-xs">
                        </div>

                        <button onclick="saveIntermissionRecord()" class="w-full bg-gradient-to-r from-purple-600 to-rose-500 text-white py-3 rounded-xl text-xs font-semibold shadow-lg hover:opacity-90 transition">인터미션 임시 저장하기</button>
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
